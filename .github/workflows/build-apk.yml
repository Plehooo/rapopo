name: Build LIVE TV Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build LIVE TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools"                      "platforms;android-35"                      "build-tools;35.0.0"                      "cmake;3.22.1"                      "ndk;26.3.11579264"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug             --no-daemon             --stacktrace             --console=plain             --max-workers=2

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIVE-TV-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # BUG FIX: sebelumnya tiap push bikin artifact APK baru (nama beda2
      # per run_number) dengan retention 30 hari, tapi TIDAK PERNAH ada yang
      # menghapus artifact lama. Jadi tiap kali push, storage Actions di
      # GitHub numpuk terus (makin lama makin banyak APK ~11MB nyangkut),
      # sampai akhirnya kena limit kuota storage repo. Step ini otomatis
      # hapus artifact lama, cuma nyisain 3 build terbaru, tiap kali ada
      # build baru sukses — jadi storage tetap stabil, gak numpuk terus.
      - name: Cleanup old APK artifacts
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const keep = 3;
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const apkArtifacts = data.artifacts
              .filter(a => a.name.startsWith("LIVE-TV-debug-"))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const toDelete = apkArtifacts.slice(keep);
            for (const artifact of toDelete) {
              console.log(`Deleting old artifact: ${artifact.name} (id ${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
