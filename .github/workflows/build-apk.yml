name: Build LIVE TV Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build LIVE TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools"                      "platforms;android-35"                      "build-tools;35.0.0"                      "cmake;3.22.1"                      "ndk;26.3.11579264"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run JVM unit tests
        run: |
          ./gradlew :app:testDebugUnitTest             --no-daemon             --stacktrace             --console=plain             --max-workers=2

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug             --no-daemon             --stacktrace             --console=plain             --max-workers=2

      - name: Lint debug APK
        run: |
          ./gradlew :app:lintDebug             --no-daemon             --stacktrace             --console=plain             --max-workers=2

      - name: Verify debug APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LIVE-TV-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # Build APK RELEASE yang ditandatangani (signed) beneran, pakai keystore
      # yang disimpan sebagai GitHub Secret (RELEASE_KEYSTORE_BASE64) — bukan
      # di-commit ke repo. Kalau secret belum di-set di repo Settings > Secrets
      # and variables > Actions, langkah-langkah di bawah otomatis di-skip
      # (gak bikin build gagal), jadi aman buat repo yang belum setup release
      # signing sama sekali.
      #
      # CATATAN: `secrets.xxx` gak boleh dipakai langsung di `if:` (GitHub
      # Actions menolak workflow-nya, "Unrecognized named-value: secrets").
      # Makanya ceknya dilakuin di step ini dulu lewat `env:`, hasilnya
      # dititipkan ke $GITHUB_OUTPUT, baru step-step berikutnya pakai
      # `if: steps.check_release_secret.outputs.has_secret == 'true'`.
      - name: Check release keystore secret
        id: check_release_secret
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.check_release_secret.outputs.has_secret == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Build signed release APK
        if: steps.check_release_secret.outputs.has_secret == 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease             --no-daemon             --stacktrace             --console=plain             --max-workers=2

      - name: Remove decoded keystore from runner
        if: always()
        run: rm -f "${{ runner.temp }}/release.keystore"

      - name: Verify release APK
        if: steps.check_release_secret.outputs.has_secret == 'true'
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        if: steps.check_release_secret.outputs.has_secret == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LIVE-TV-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # BUG FIX: sebelumnya tiap push bikin artifact APK baru (nama beda2
      # per run_number) dengan retention 30 hari, tapi TIDAK PERNAH ada yang
      # menghapus artifact lama. Jadi tiap kali push, storage Actions di
      # GitHub numpuk terus (makin lama makin banyak APK ~11MB nyangkut),
      # sampai akhirnya kena limit kuota storage repo. Step ini otomatis
      # hapus artifact lama, cuma nyisain 3 build terbaru, tiap kali ada
      # build baru sukses — jadi storage tetap stabil, gak numpuk terus.
      - name: Cleanup old APK artifacts
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const keep = 3;
            const prefixes = ["LIVE-TV-debug-", "LIVE-TV-release-"];
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const prefix of prefixes) {
              const artifacts = data.artifacts
                .filter(a => a.name.startsWith(prefix))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              const toDelete = artifacts.slice(keep);
              for (const artifact of toDelete) {
                console.log(`Deleting old artifact: ${artifact.name} (id ${artifact.id})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }


  remote-sync:
    name: Push LIVE TV remote update
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect remote-data changes
        id: changes
        run: |
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            files="$(git ls-tree -r --name-only HEAD)"
          else
            files="$(git diff --name-only "$before" "${{ github.sha }}")"
          fi
          echo "$files"
          playlist=0
          announcement=0
          echo "$files" | grep -Fxq 'adit.m3u' && playlist=1 || true
          echo "$files" | grep -Fxq 'notif.json' && announcement=1 || true
          echo "playlist=$playlist" >> "$GITHUB_OUTPUT"
          echo "announcement=$announcement" >> "$GITHUB_OUTPUT"
          if [ "$playlist" = 1 ] || [ "$announcement" = 1 ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate remote-data payloads
        if: steps.changes.outputs.send == 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.changes.outputs.playlist }}" = "1" ]; then
            test -s adit.m3u
            python3 - <<'PY'
            from pathlib import Path
            import re
            lines = [x.strip() for x in Path("adit.m3u").read_text(encoding="utf-8-sig").splitlines()]
            assert lines and lines[0].upper().startswith("#EXTM3U"), "Missing #EXTM3U header"
            entries = 0
            for i, line in enumerate(lines):
                if not line.startswith("#EXTINF:"):
                    continue
                entries += 1
                j = i + 1
                while j < len(lines) and not lines[j]:
                    j += 1
                assert j < len(lines), f"EXTINF at line {i+1} has no URL"
                url = lines[j]
                assert not url.startswith("#"), f"EXTINF at line {i+1} has no stream URL"
                assert re.match(r"^[A-Za-z][A-Za-z0-9+.-]*://", url), f"Invalid stream URL after line {i+1}: {url[:100]}"
            assert entries >= 1, "No EXTINF entries found"
            print(f"Valid M3U entries: {entries}")
            PY
          fi
          if [ "${{ steps.changes.outputs.announcement }}" = "1" ]; then
            jq -e '(.id != null) and (.enabled != null) and (.title != null) and (.message != null)' notif.json >/dev/null
            jq -e '(.title | type == "string") and (.message | type == "string") and (.enabled | type == "boolean")' notif.json >/dev/null
          fi

      - name: Check FCM credential
        if: steps.changes.outputs.send == 'true'
        id: fcm_secret
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FCM_SERVICE_ACCOUNT_JSON" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "FCM_SERVICE_ACCOUNT_JSON is not configured; skipping push notification."
          fi

      - name: Read Firebase project id
        if: steps.changes.outputs.send == 'true' && steps.fcm_secret.outputs.ready == 'true'
        id: firebase_project
        run: |
          project_id=$(jq -r '.project_info.project_id // empty' app/google-services.json)
          test -n "$project_id"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google/Firebase
        if: steps.changes.outputs.send == 'true' && steps.fcm_secret.outputs.ready == 'true'
        id: google-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          token_format: access_token

      - name: Push FCM invalidation event
        if: steps.changes.outputs.send == 'true' && steps.fcm_secret.outputs.ready == 'true'
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          FIREBASE_PROJECT_ID: ${{ steps.firebase_project.outputs.project_id }}
          PLAYLIST_CHANGED: ${{ steps.changes.outputs.playlist }}
          ANNOUNCEMENT_CHANGED: ${{ steps.changes.outputs.announcement }}
          EVENT_ID: ${{ github.sha }}
        run: |
          jq -n \
            --arg topic "bittv-live-updates" \
            --arg type "bittv_remote_sync" \
            --arg event_id "$EVENT_ID" \
            --arg playlist_changed "$PLAYLIST_CHANGED" \
            --arg announcement_changed "$ANNOUNCEMENT_CHANGED" \
            '{message:{topic:$topic,data:{type:$type,event_id:$event_id,playlist_changed:$playlist_changed,announcement_changed:$announcement_changed},android:{priority:"HIGH",ttl:"86400s"}}}' \
            > /tmp/fcm.json
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json; UTF-8' \
            -d @/tmp/fcm.json \
            "https://fcm.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/messages:send"
