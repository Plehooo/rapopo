name: BITTV Realtime Update

on:
  repository_dispatch:
    types:
      - remote-live-update
  workflow_dispatch:
    inputs:
      kind:
        description: "Update kind"
        required: true
        default: "notification"
      revision:
        description: "Source revision"
        required: false
        default: "manual"

permissions:
  contents: read

jobs:
  publish:
    name: Publish FCM realtime event
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install Firebase Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Write service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Send realtime FCM
        working-directory: functions
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          EVENT_KIND: ${{ github.event.client_payload.kind || inputs.kind || 'notification' }}
          EVENT_REVISION: ${{ github.event.client_payload.revision || inputs.revision || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { getMessaging } from 'firebase-admin/messaging';
          import { initializeApp } from 'firebase-admin/app';
          import crypto from 'node:crypto';

          initializeApp();

          const kind = String(process.env.EVENT_KIND || 'notification');
          const revision = String(process.env.EVENT_REVISION || process.env.GITHUB_SHA || 'manual');

          const fingerprintOf = (id, enabled, title, message) =>
            crypto.createHash('sha256')
              .update(`${String(id).trim()}\n${Boolean(enabled)}\n${String(title).trim()}\n${String(message).trim()}`)
              .digest('hex');

          const data = {
            kind,
            revision,
            source: 'github-actions'
          };

          // Notification changes originate in Plehooo/ditz/notif.json.
          // Include the actual content in the FCM data payload so the Android
          // receiver never has to open the app or perform a network fetch.
          if (kind === 'notification') {
            const url = 'https://raw.githubusercontent.com/Plehooo/ditz/refs/heads/main/notif.json?cb=' + Date.now();
            const response = await fetch(url, { cache: 'no-store' });
            if (!response.ok) throw new Error(`notif.json HTTP ${response.status}`);

            const payload = await response.json();
            const id = String(payload?.id ?? '0');
            const title = String(payload?.title ?? 'Pengumuman');
            const message = String(payload?.message ?? '');
            const enabled = payload?.enabled !== false;
            const fingerprint = fingerprintOf(id, enabled, title, message);

            data.notif_id = id;
            data.notif_title = title;
            data.notif_message = message;
            data.notif_enabled = String(enabled);
            data.notif_fingerprint = fingerprint;
          }

          const visible = ['notification', 'game', 'mabar', 'quest', 'reward', 'content'].includes(kind);

          const message = {
            topic: 'bittv_live_updates',
            data,
            android: {
              priority: visible ? 'high' : 'normal'
            }
          };

          const id = await getMessaging().send(message);
          console.log(`FCM sent: ${id}`);
          console.log(`kind=${kind} revision=${revision}`);
          if (data.notif_fingerprint) console.log(`notification fingerprint=${data.notif_fingerprint}`);
          NODE

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
