name: Publish LIVE TV Remote Update

on:
  # Only used if remote data is ever moved into this repository.
  push:
    branches: [ "main" ]
    paths:
      - "adit.m3u"
      - "notif.json"

  # Primary cross-repository trigger from Plehooo/ditz.
  repository_dispatch:
    types: [remote-live-update]

  # Safety net if the external repository trigger is temporarily unavailable.
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      kind:
        description: "sync | playlist | notification"
        required: false
        default: "sync"

permissions:
  contents: read
  id-token: write

concurrency:
  group: bittv-remote-fcm-publisher
  cancel-in-progress: true

jobs:
  publish:
    name: Detect remote changes and send data-only FCM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore remote state
        id: remote_cache
        uses: actions/cache@v4
        with:
          path: .remote-state
          key: bittv-remote-state-${{ github.run_id }}
          restore-keys: |
            bittv-remote-state-

      - name: Detect changed remote data
        id: detect
        env:
          REMOTE_M3U_URL: https://raw.githubusercontent.com/Plehooo/ditz/refs/heads/main/adit.m3u
          REMOTE_NOTIF_URL: https://raw.githubusercontent.com/Plehooo/ditz/refs/heads/main/notif.json
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_KIND: ${{ github.event.client_payload.kind || github.event.inputs.kind || 'sync' }}
        run: |
          set -euo pipefail
          mkdir -p .remote-state

          fetch_hash() {
            curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 45 "$1" \
              | sha256sum | awk '{print $1}'
          }

          M3U_HASH="$(fetch_hash "$REMOTE_M3U_URL")"
          NOTIF_HASH="$(fetch_hash "$REMOTE_NOTIF_URL")"

          OLD_M3U=""
          OLD_NOTIF=""
          [ -f .remote-state/m3u.sha256 ] && OLD_M3U="$(cat .remote-state/m3u.sha256)"
          [ -f .remote-state/notif.sha256 ] && OLD_NOTIF="$(cat .remote-state/notif.sha256)"

          printf '%s' "$M3U_HASH" > .remote-state/m3u.sha256
          printf '%s' "$NOTIF_HASH" > .remote-state/notif.sha256

          CHANGED=false
          KIND="sync"

          if [ "$EVENT_NAME" = "repository_dispatch" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # The external trigger already classified the change. This lets the
            # sender choose HIGH only when it has a real visible announcement.
            CHANGED=true
            KIND="$DISPATCH_KIND"
          elif [ -z "$OLD_M3U" ] || [ -z "$OLD_NOTIF" ]; then
            # First scheduled run establishes a silent publisher baseline.
            CHANGED=false
          elif [ "$M3U_HASH" != "$OLD_M3U" ] && [ "$NOTIF_HASH" != "$OLD_NOTIF" ]; then
            CHANGED=true
            KIND="sync"
          elif [ "$M3U_HASH" != "$OLD_M3U" ]; then
            CHANGED=true
            KIND="playlist"
          elif [ "$NOTIF_HASH" != "$OLD_NOTIF" ]; then
            CHANGED=true
            KIND="notification"
          fi

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

      - name: Fetch notification payload when relevant
        if: steps.detect.outputs.changed == 'true' && steps.detect.outputs.kind != 'playlist'
        env:
          REMOTE_NOTIF_URL: https://raw.githubusercontent.com/Plehooo/ditz/refs/heads/main/notif.json
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 30 \
            "$REMOTE_NOTIF_URL" > "$RUNNER_TEMP/notif.json"
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/notif.json','utf8')); if (x===null || typeof x!=='object' || !Object.prototype.hasOwnProperty.call(x,'id')) throw new Error('invalid notif.json')"

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: steps.detect.outputs.changed == 'true'
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: idtzhah
          workload_identity_provider: "projects/834553102006/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "firebase-adminsdk-fbsvc@idtzhah.iam.gserviceaccount.com"
          token_format: access_token
          access_token_scopes: "https://www.googleapis.com/auth/firebase.messaging"

      - name: Send FCM topic signal
        if: steps.detect.outputs.changed == 'true'
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FIREBASE_PROJECT_ID: idtzhah
          FCM_KIND: ${{ steps.detect.outputs.kind }}
          SOURCE_REPO: Plehooo/ditz
          SOURCE_SHA: ${{ github.event.client_payload.revision || github.sha }}
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { existsSync, readFileSync } from 'node:fs';

          const accessToken = process.env.ACCESS_TOKEN;
          if (!accessToken) {
            throw new Error('Missing access token from the Workload Identity Federation auth step');
          }

          const projectId = process.env.FIREBASE_PROJECT_ID;
          if (!projectId) throw new Error('Firebase project ID is missing');

          const kind = String(process.env.FCM_KIND || 'sync');
          let notif = null;
          const notifPath = `${process.env.RUNNER_TEMP}/notif.json`;
          if (existsSync(notifPath) && kind !== 'playlist') {
            const payload = JSON.parse(readFileSync(notifPath, 'utf8'));
            const id = String(payload.id ?? '0').trim();
            const enabled = Boolean(payload.enabled ?? true);
            const title = String(payload.title ?? '').trim();
            const message = String(payload.message ?? '').trim();
            const source = `${id}\n${enabled}\n${title}\n${message}`;
            const fingerprint = createHash('sha256').update(source, 'utf8').digest('hex');
            notif = { id, enabled, title, message, fingerprint };
          }

          const data = {
            kind,
            source: String(process.env.SOURCE_REPO || ''),
            revision: String(process.env.SOURCE_SHA || ''),
            ts: new Date().toISOString(),
          };

          if (notif) {
            data.notif_id = notif.id;
            data.notif_enabled = String(notif.enabled);
            data.notif_title = notif.title;
            data.notif_message = notif.message;
            data.notif_fingerprint = notif.fingerprint;
          }

          const hasVisibleAnnouncement = Boolean(
            notif?.enabled && notif.title && notif.message
          );

          const android = {
            priority: hasVisibleAnnouncement ? 'HIGH' : 'NORMAL',
            ttl: '3600s',
            collapse_key: hasVisibleAnnouncement
              ? 'bittv-remote-announcement'
              : 'bittv-remote-sync',
          };

          // IMPORTANT: a notification+data message lets Firebase/Android place
          // the announcement directly into the system tray while the app is
          // backgrounded/not open. In foreground, onMessageReceived() still
          // receives the message and keeps the app's branded notification path.
          if (hasVisibleAnnouncement) {
            android.notification = {
              title: notif.title,
              body: notif.message,
              channel_id: 'remote_announcements',
              icon: 'ic_app_logo',
              tag: 'bittv-remote-announcement',
            };
          }

          const body = {
            message: {
              topic: 'bittv_live_updates',
              data,
              android,
            },
          };

          const response = await fetch(
            `https://fcm.googleapis.com/v1/projects/${encodeURIComponent(projectId)}/messages:send`,
            {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${accessToken}`,
                'Content-Type': 'application/json; charset=UTF-8',
              },
              body: JSON.stringify(body),
            },
          );

          const text = await response.text();
          if (!response.ok) throw new Error(`FCM HTTP ${response.status}: ${text}`);
          console.log(text);
          NODE
